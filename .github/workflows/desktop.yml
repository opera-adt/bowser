# Desktop app builds (Windows, macOS, Linux). Every run uploads the apps as workflow
# artifacts; a v* tag also attaches them to a GitHub Release. Unsigned for now.
name: Desktop app

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-15, name: macos-arm64 }
          - { os: macos-15-intel, name: macos-x64 }
          - { os: ubuntu-latest, name: linux-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - name: Build the UI
        run: npm ci && npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Linux window libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev gir1.2-webkit2-4.1 python3-gi
      - name: Install the app's dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/requirements-desktop.txt
          python -m pip install -e . --no-deps
      - name: Version
        id: version
        # A tag gives "0.6.0"; a branch such as fix/x gives "fix-x" (no "/" in file names).
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=${v//\//-}" >> "$GITHUB_OUTPUT"
      - name: Freeze with PyInstaller
        run: pyinstaller packaging/bowser.spec --noconfirm
      - name: Sample cube for the smoke test
        run: |
          # Wheels only: rasterio's source build needs GDAL, which the runners lack.
          python -m pip install --only-binary rasterio rioxarray
          python -c "import sys; sys.path.insert(0, 'tests/regression'); from pathlib import Path; from cube import make_cube; make_cube(Path('smoke.zarr'))"
      - name: Smoke test the frozen app
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then APP=dist/Bowser/Bowser.exe;
          elif [ "$RUNNER_OS" = "macOS" ]; then APP=dist/Bowser.app/Contents/MacOS/Bowser;
          else APP=dist/Bowser/Bowser; fi
          "$APP" --smoke-test "$PWD/smoke.zarr"
      - name: Package (Windows installer and portable zip)
        if: runner.os == 'Windows'
        run: |
          choco install innosetup --no-progress -y
          iscc "//DAppVersion=${{ steps.version.outputs.version }}" packaging/windows/bowser.iss
          7z a "release/Bowser-${{ steps.version.outputs.version }}-windows-x64-portable.zip" ./dist/Bowser/*
      - name: Package (macOS dmg)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release dmg
          # The usual drag-to-install window: Bowser.app next to an Applications link.
          cp -R dist/Bowser.app dmg/
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on the hosted runners: retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname Bowser -srcfolder dmg -ov -format UDZO \
              "release/Bowser-${{ steps.version.outputs.version }}-${{ matrix.name }}.dmg" && break
            [ "$i" = 5 ] && exit 1
            echo "hdiutil failed (try $i); retrying in 10 s"; sleep 10
          done
      - name: Package (Linux tar.gz)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release
          tar -C dist -czf "release/Bowser-${{ steps.version.outputs.version }}-${{ matrix.name }}.tar.gz" Bowser
      - name: Sizes and checksums
        run: |
          cd release
          for f in *; do echo "$f $(du -h "$f" | cut -f1)"; done
          if command -v sha256sum >/dev/null; then sha256sum * > SHA256SUMS-${{ matrix.name }}.txt; else shasum -a 256 * > SHA256SUMS-${{ matrix.name }}.txt; fi
      - uses: actions/upload-artifact@v7
        with:
          name: Bowser-${{ matrix.name }}
          path: release/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      # Attach the builds to the tag's release, creating it as a draft if there is
      # none yet. Never publish here: publishing a release runs CD (PyPI).
      - name: Attach to the release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "$TAG" --notes "Desktop builds are attached below. They are not signed yet:
          - Windows: if SmartScreen warns, choose More info, then Run anyway.
          - macOS: the first time, right-click Bowser.app and choose Open."
          fi
          gh release upload "$TAG" release/* --repo "$GITHUB_REPOSITORY" --clobber
