<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bowser</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css"
        integrity="sha384-uTttxo/aOKbdE5RlD/SPzSDoDmNvGlUYPjONi2MN/b7c9HPSvW07OIuyP7uL6jxK" crossorigin="" />
  <link rel="icon" type="image/svg+xml" href="/bowser-mark.svg" />
  <script>
    // Same theme as the app (Project › Appearance, or the rail toggle).
    try { const t = localStorage.getItem("bowser-theme"); if (t) document.documentElement.setAttribute("data-theme", t); } catch {}
  </script>
  <style>
    /* Bowser's graphite and teal, as in the app. */
    :root {
      --bg: #f5f4f1; --surface: #ffffff; --surface2: #eceae5; --border: #cbc9c3;
      --text: #1d1e20; --muted: #5c5e62; --accent: #0a7d7b; --accent2: #065c5a; --on-accent: #ffffff; --red: #b3261e;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #1a1b1e; --surface: #23252a; --surface2: #30333a; --border: #444750;
        --text: #e8e6e3; --muted: #9a9a9e; --accent: #5bc0be; --accent2: #85d5d4; --on-accent: #072a2d; --red: #e07b7b;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1b1e; --surface: #23252a; --surface2: #30333a; --border: #444750;
      --text: #e8e6e3; --muted: #9a9a9e; --accent: #5bc0be; --accent2: #85d5d4; --on-accent: #072a2d; --red: #e07b7b;
      color-scheme: dark;
    }
    body { margin: 0; font-family: var(--font); color: var(--text); background: var(--bg); }
    #map { position: fixed; inset: 0; }
    #panel {
      position: fixed; top: 16px; left: 16px; z-index: 1000;
      width: min(26rem, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box;
      display: flex; flex-direction: column; gap: 14px; padding: 18px;
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 34px; height: 34px; }
    h1 { margin: 0; font-size: 1.25rem; font-weight: 600; letter-spacing: -0.01em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 0.85rem; }
    .section-label { margin: 0 0 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
    #list { list-style: none; margin: 0; padding: 0; max-height: 40vh; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
    #list li {
      padding: 9px 11px; border-radius: 10px; background: var(--surface2); cursor: pointer;
      border: 1px solid transparent; transition: border-color 120ms;
    }
    #list li:hover { border-color: var(--accent); }
    #list li.empty { cursor: default; background: none; padding: 4px 0; }
    #list li.empty:hover { border-color: transparent; }
    #list .name { font-weight: 600; font-size: 0.9rem; }
    #list .id { font-family: var(--mono); color: var(--muted); font-size: 0.74rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #list .desc { color: var(--muted); font-size: 0.8rem; margin-top: 2px; }
    .paste { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
    .paste label { color: var(--muted); font-size: 0.8rem; }
    .paste input {
      width: 100%; box-sizing: border-box; padding: 8px 10px;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
      font-family: var(--mono); font-size: 0.8rem;
    }
    .paste input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    .row { display: flex; gap: 6px; }
    .row input { flex: 1; min-width: 0; }
    .paste button {
      flex: none; padding: 8px 14px; background: var(--accent); color: var(--on-accent);
      border: 0; border-radius: 8px; cursor: pointer; font: inherit; font-weight: 600;
    }
    .paste button.secondary { background: var(--surface2); color: var(--text); font-weight: 500; }
    .paste button:hover:not(:disabled) { filter: brightness(1.08); }
    .paste button:disabled, .paste input:disabled { opacity: 0.5; cursor: not-allowed; }
    #folder-row { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    #folder-row[hidden] { display: none; }
    #open-error { color: var(--red); }
    .empty { color: var(--muted); font-size: 0.85rem; }
    .maplibregl-map { background: var(--bg); }
    .maplibregl-popup-content { background: var(--surface); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 0.8rem; }
    .maplibregl-popup-tip { display: none; }
    .maplibregl-popup-content code { font-family: var(--mono); color: var(--muted); font-size: 0.74rem; }
    #search {
      width: 100%; box-sizing: border-box; padding: 8px 10px; margin-bottom: 6px;
      background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; font: inherit; font-size: 0.85rem;
    }
    #search:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
    #search-note { margin: 0 0 6px; }
    #search-note[hidden], #list li[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <div class="brand"><img src="/bowser-mark.svg" alt="" /><h1>Bowser</h1></div>
    <p class="subtitle">Open an InSAR cube: pick one below or on the map, open a path or link, or find the cubes in a folder.</p>
    <div>
      <p class="section-label">Datasets</p>
      <input id="search" type="search" aria-label="Search datasets or places" autocomplete="off"
             placeholder="Search datasets, or a place (Enter)" />
      <p id="search-note" class="subtitle" role="status" hidden></p>
      <ul id="list"><li class="empty">Loading catalog…</li></ul>
    </div>
    <div class="paste">
      <p class="section-label">Open a cube</p>
      <div class="row">
        <input id="uri" type="text" aria-label="Path or link to a .zarr cube"
               placeholder="/path/to/cube.zarr  or  s3://…  or  https://…"
               disabled title="Opening data from the page is off on this server." />
        <button id="open-uri" disabled
                title="Opening data from the page is off on this server.">Open</button>
      </div>
      <p id="open-error" class="subtitle" hidden></p>
      <div id="folder-row" hidden>
        <p class="section-label">Find cubes in a folder</p>
        <div class="row">
          <input id="folder" type="text" aria-label="Folder to search" placeholder="/path/to/folder" />
          <button id="choose-folder" class="secondary" hidden>Choose…</button>
          <button id="search-folder" class="secondary">Search</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"
          integrity="sha384-5+cfbwT0iiub6VsQAdn6yz16nr6sDiQoHx6tm4O8OVYXHYOxcffFmCJBL0dgdvGp" crossorigin=""></script>
  <script>
    // A globe, as the app's map library draws it; flat Mercator again when zoomed in.
    const map = new maplibregl.Map({
      container: "map",
      style: {
        version: 8,
        sources: {
          osm: { type: "raster", tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256,
                 maxzoom: 19, attribution: "© OpenStreetMap" },
        },
        layers: [{ id: "osm", type: "raster", source: "osm" }],
      },
      center: [0, 20], zoom: 1.4, attributionControl: { compact: true },
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");  // the panel covers the top left
    map.on("style.load", () => map.setProjection({ type: "globe" }));
    const accent = () => getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#0a7d7b";
    // Keep what is shown clear of the panel on the left.
    const padding = () => {
      const panel = document.getElementById("panel").getBoundingClientRect();
      const wide = window.innerWidth > panel.right + 240;
      return { top: 40, bottom: 40, right: 40, left: wide ? panel.right + 40 : 40 };
    };
    const mapReady = new Promise((resolve) => map.on("load", resolve));

    function launch(datasetId) {
      // Redirect to the main app carrying the dataset id. The frontend
      // and backend both accept ``?dataset=<id>`` to route multi-tenant
      // requests at the catalog entry.
      window.location.href = `/?dataset=${encodeURIComponent(datasetId)}`;
    }

    // Build DOM via textContent + createElement, never innerHTML. Catalog
    // fields are operator-authored, not user input — but XSS-safe rendering
    // is one-liner cheap so there's no reason to trust them.
    const mkEl = (tag, cls, text) => {
      const el = document.createElement(tag);
      if (cls) el.className = cls;
      if (text !== undefined) el.textContent = text;
      return el;
    };

    const setEmpty = (msg) => {
      const list = document.getElementById("list");
      list.textContent = "";
      list.appendChild(mkEl("li", "empty", msg));
    };

    async function loadCatalog() {
      const res = await fetch("/catalog");
      const { datasets, allow_open } = await res.json();
      enableOpen(!!allow_open);

      if (!datasets.length) {
        setEmpty(allow_open
          ? "Nothing opened yet. Give the path or URL of a .zarr store below."
          : "Catalog is empty. Add entries with `bowser register` on the server.");
        return;
      }

      const list = document.getElementById("list");
      list.textContent = "";

      catalog = datasets;
      for (const d of datasets) {
        const li = document.createElement("li");
        li.dataset.id = d.id;
        li.dataset.search = `${d.name} ${d.id} ${d.description ?? ""}`.toLowerCase();
        li.appendChild(mkEl("div", "name", d.name));
        li.appendChild(mkEl("div", "id", d.id));
        if (d.description) li.appendChild(mkEl("div", "desc", d.description));
        li.addEventListener("click", () => launch(d.id));
        li.addEventListener("mouseenter", () => highlight(d.id));
        li.addEventListener("mouseleave", () => highlight(null));
        list.appendChild(li);
      }
      await mapReady;
      drawFootprints(datasets);
      fitTo(datasets, false);
    }

    // The catalog's footprints on the globe: hover to name one, click to open it.
    let catalog = [];
    const footprint = (d) => {
      const [w, s, e, n] = d.bbox;
      return { type: "Feature", properties: { id: d.id, name: d.name },
               geometry: { type: "Polygon", coordinates: [[[w, s], [e, s], [e, n], [w, n], [w, s]]] } };
    };
    function drawFootprints(datasets) {
      map.addSource("cubes", { type: "geojson", promoteId: "id",
                               data: { type: "FeatureCollection", features: datasets.map(footprint) } });
      const hovered = ["boolean", ["feature-state", "hover"], false];
      map.addLayer({ id: "cubes-fill", type: "fill", source: "cubes",
                     paint: { "fill-color": accent(), "fill-opacity": ["case", hovered, 0.3, 0.15] } });
      map.addLayer({ id: "cubes-line", type: "line", source: "cubes",
                     paint: { "line-color": accent(), "line-width": ["case", hovered, 4, 2] } });
      // Zoomed out, a small cube's outline is too small to see: a dot at its centre marks it.
      map.addSource("cube-dots", { type: "geojson", promoteId: "id", data: { type: "FeatureCollection", features: datasets.map((d) => {
        const [w, s, e, n] = d.bbox;
        return { type: "Feature", properties: { id: d.id, name: d.name }, geometry: { type: "Point", coordinates: [(w + e) / 2, (s + n) / 2] } };
      }) } });
      map.addLayer({ id: "cubes-dot", type: "circle", source: "cube-dots", maxzoom: 6,
                     paint: { "circle-color": accent(), "circle-radius": ["case", ["boolean", ["feature-state", "hover"], false], 8, 6],
                              "circle-stroke-color": "#ffffff", "circle-stroke-width": 1.5 } });
      const popup = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 8 });
      const onHover = (e) => {
        const f = e.features[0];
        map.getCanvas().style.cursor = "pointer";
        highlight(f.properties.id);
        const tip = document.createElement("div");
        tip.appendChild(mkEl("strong", null, f.properties.name));
        tip.appendChild(document.createElement("br"));
        tip.appendChild(mkEl("code", null, f.properties.id));
        popup.setLngLat(e.lngLat).setDOMContent(tip).addTo(map);
      };
      for (const layer of ["cubes-fill", "cubes-dot"]) {
        map.on("mousemove", layer, onHover);
        map.on("mouseleave", layer, () => { map.getCanvas().style.cursor = ""; highlight(null); popup.remove(); });
        map.on("click", layer, (e) => launch(e.features[0].properties.id));
      }
    }
    let lit = null;
    function highlight(id) {
      if (!map.getSource("cubes")) return;
      for (const source of ["cubes", "cube-dots"]) {
        if (lit) map.setFeatureState({ source, id: lit }, { hover: false });
        if (id) map.setFeatureState({ source, id }, { hover: true });
      }
      lit = id;
    }
    function fitTo(datasets, animate = true) {
      if (!datasets.length) return;
      const b = datasets.map((d) => d.bbox).reduce((a, c) => [Math.min(a[0], c[0]), Math.min(a[1], c[1]), Math.max(a[2], c[2]), Math.max(a[3], c[3])]);
      map.fitBounds([[b[0], b[1]], [b[2], b[3]]], { padding: padding(), maxZoom: 9, duration: animate ? 900 : 0 });
    }

    // Search: typing narrows the datasets (list and globe); Enter shows the matches, or goes to
    // a place when none match (the server's place search, on where the Assistant is).
    const searchBox = document.getElementById("search");
    const searchNote = document.getElementById("search-note");
    const note = (text) => { searchNote.textContent = text || ""; searchNote.hidden = !text; };
    function matches() {
      const q = searchBox.value.trim().toLowerCase();
      return catalog.filter((d) => !q || `${d.name} ${d.id} ${d.description ?? ""}`.toLowerCase().includes(q));
    }
    searchBox.addEventListener("input", () => {
      const q = searchBox.value.trim().toLowerCase();
      note("");
      for (const li of document.querySelectorAll("#list li[data-search]")) li.hidden = !!q && !li.dataset.search.includes(q);
      if (map.getLayer("cubes-fill")) {
        const ids = matches().map((d) => d.id);
        const filter = q ? ["in", ["get", "id"], ["literal", ids]] : null;
        for (const layer of ["cubes-fill", "cubes-line", "cubes-dot"]) map.setFilter(layer, filter);
      }
      if (q && catalog.length && !matches().length) note("No dataset matches. Press Enter to go to the place.");
    });
    searchBox.addEventListener("keydown", async (e) => {
      if (e.key !== "Enter") return;
      const q = searchBox.value.trim();
      if (!q) return;
      const found = matches();
      if (found.length) { fitTo(found); return; }
      note(`Looking for ${q}…`);
      try {
        const res = await fetch(`/geocode?${new URLSearchParams({ q, limit: "1" })}`);
        const body = await res.json();
        if (!res.ok) throw new Error(res.status === 404 || res.status === 503 || res.status === 403
          ? "Place search is off on this server." : (body.detail || `HTTP ${res.status}`));
        const place = body.results?.[0];
        if (!place) { note(`No place found for ${q}.`); return; }
        if (place.bbox) map.fitBounds([[place.bbox[0], place.bbox[1]], [place.bbox[2], place.bbox[3]]], { padding: padding(), maxZoom: 12 });
        else map.flyTo({ center: [place.lon, place.lat], zoom: 10, padding: padding() });
        note(`${place.name}${body.attribution ? ` (${body.attribution})` : ""}`);
      } catch (err) {
        note(err.message || String(err));
      }
    });

    // Open a store by path or URL (POST /catalog/open), when the server allows
    // it (`bowser run` does for a local single-worker server).
    function enableOpen(allowed) {
      const input = document.getElementById("uri");
      const button = document.getElementById("open-uri");
      if (!allowed) return;
      input.disabled = button.disabled = false;
      input.title = button.title = "Path on this computer, or an s3:// or https:// URL";
      const error = document.getElementById("open-error");
      const open = async () => {
        const uri = input.value.trim();
        if (!uri) return;
        button.disabled = true;
        button.textContent = "Opening…";
        error.hidden = true;
        try {
          const res = await fetch("/catalog/open", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ uri }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          launch(body.id);
        } catch (err) {
          error.textContent = err.message || String(err);
          error.hidden = false;
          button.disabled = false;
          button.textContent = "Open";
        }
      };
      button.addEventListener("click", open);
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") open(); });
      enableFolders(error);
    }

    // Folder search (POST /catalog/scan); in the desktop app a native chooser fills the folder.
    function enableFolders(error) {
      const row = document.getElementById("folder-row");
      const folder = document.getElementById("folder");
      const choose = document.getElementById("choose-folder");
      row.hidden = false;
      try { folder.value = localStorage.getItem("bowser-search-folder") || ""; } catch { /* first visit */ }
      const search = async () => {
        const dir = folder.value.trim();
        if (!dir) return;
        error.hidden = true;
        setEmpty(`Searching ${dir}…`);
        try {
          const res = await fetch("/catalog/scan", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ dir }),
          });
          const body = await res.json();
          if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
          try { localStorage.setItem("bowser-search-folder", dir); } catch { /* not kept */ }
          showFound(body.cubes, dir, body.truncated);
        } catch (err) {
          setEmpty("Search failed.");
          error.textContent = err.message || String(err);
          error.hidden = false;
        }
      };
      document.getElementById("search-folder").addEventListener("click", search);
      folder.addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
      const showChooser = () => {
        if (!window.pywebview?.api?.pick_folder) return;
        choose.hidden = false;
      };
      showChooser();
      window.addEventListener("pywebviewready", showChooser);
      choose.addEventListener("click", async () => {
        const picked = await window.pywebview.api.pick_folder();
        if (picked) { folder.value = picked; search(); }
      });
    }

    function showFound(cubes, dir, truncated) {
      const list = document.getElementById("list");
      list.textContent = "";
      if (!cubes.length) { setEmpty(`No .zarr cubes in ${dir}.`); return; }
      for (const c of cubes) {
        const li = document.createElement("li");
        li.appendChild(mkEl("div", "name", c.title || c.name));
        li.appendChild(mkEl("div", "id", c.path));
        li.addEventListener("click", async () => {
          li.appendChild(mkEl("div", "desc", "Opening…"));
          const res = await fetch("/catalog/open", {
            method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ uri: c.path }),
          });
          const body = await res.json();
          if (res.ok) launch(body.id);
          else li.appendChild(mkEl("div", "desc", body.detail || `HTTP ${res.status}`));
        });
        list.appendChild(li);
      }
      if (truncated) list.appendChild(mkEl("li", "empty", `Showing the first ${cubes.length}; search a smaller folder for the rest.`));
    }

    loadCatalog().catch((err) => {
      setEmpty("Failed to load catalog: " + (err.message || String(err)));
    });
  </script>
</body>
</html>
